name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore AmazonCreators.Net.sln

    - name: Build solution (Release)
      run: dotnet build AmazonCreators.Net.sln -c Release --no-restore

    - name: Run Tests
      run: dotnet test AmazonCreators.Net.sln -c Release --no-build --verbosity normal

    - name: Pack NuGet Package
      run: dotnet pack src/AmazonCreators.Net/AmazonCreators.Net.csproj -c Release -o ./artifacts
